name: Build Board

on:
  # 手动选择单个板卡构建，不影响 Build Boards 的增量 CI。
  workflow_dispatch:
    inputs:
      board:
        description: '板卡目录，示例：nologo/xingzhi-cube-2.0tft-wifi；无厂商前缀的写 bread-compact-wifi；完整列表见 python3 scripts/build.py --list-boards'
        required: true
        type: string
      name:
        description: '变体名，示例：xingzhi-cube-2.0tft-wifi；板卡只有单个变体时可留空'
        required: false
        type: string
      language:
        description: '固件语言'
        required: true
        default: zh-CN
        type: choice
        options:
          - zh-CN
          - en-US
      publish:
        description: '是否把固件上传到 manual-builds 发布页（同名固件会被覆盖）'
        required: true
        default: true
        type: boolean

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      artifact: xiaozhi_${{ steps.target.outputs.slug }}_${{ github.sha }}
      slug: ${{ steps.target.outputs.slug }}
    container:
      image: espressif/idf:release-v6.1
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - id: target
        name: Validate board
        shell: bash
        env:
          BOARD: ${{ inputs.board }}
          NAME: ${{ inputs.name }}
        run: |
          if [[ ! "$BOARD" =~ ^[A-Za-z0-9._/-]+$ || "$BOARD" == *..* ]]; then
            echo "::error title=Board not found::'$BOARD' 不是合法的板卡路径。示例：nologo/xingzhi-cube-2.0tft-wifi 或 bread-compact-wifi。完整列表：python3 scripts/build.py --list-boards"
            exit 1
          fi
          if [[ ! -f "main/boards/$BOARD/config.json" ]]; then
            echo "::error title=Board not found::'$BOARD' 不存在。示例：nologo/xingzhi-cube-2.0tft-wifi 或 bread-compact-wifi。完整列表：python3 scripts/build.py --list-boards"
            exit 1
          fi
          SLUG="${NAME:-$BOARD}"
          echo "slug=${SLUG//\//-}" >> "$GITHUB_OUTPUT"

      - name: Build selected board
        shell: bash
        env:
          BOARD: ${{ inputs.board }}
          NAME: ${{ inputs.name }}
          LANGUAGE: ${{ inputs.language }}
        run: |
          source "$IDF_PATH/export.sh"
          ARGS=()
          [[ -n "$NAME" ]] && ARGS+=(--name "$NAME")
          python scripts/build.py "$BOARD" --language "$LANGUAGE" "${ARGS[@]}"

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: xiaozhi_${{ steps.target.outputs.slug }}_${{ github.sha }}
          path: build/merged-binary.bin
          if-no-files-found: error
          retention-days: 30

  publish:
    name: Publish firmware to release
    needs: build
    if: ${{ inputs.publish }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: ${{ needs.build.outputs.artifact }}
          path: firmware

      # 同名资产覆盖，保证每个变体只留最近一次构建的固件。
      - name: Upload asset to manual-builds release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: manual-builds
          ASSET: xiaozhi_${{ needs.build.outputs.slug }}.bin
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" \
              --title "Manual builds" \
              --notes "Artifacts built by the Build Board workflow."
          fi
          cp firmware/merged-binary.bin "firmware/$ASSET"
          gh release upload "$TAG" "firmware/$ASSET" --clobber
          echo "### $ASSET: $(stat -c%s "firmware/$ASSET") bytes" >> "$GITHUB_STEP_SUMMARY"
          echo "$RUN_URL" >> "$GITHUB_STEP_SUMMARY"
